name: Deploy Synth Harness to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/tear_harness/**'
      - 'tools/juno_harness/**'
      - 'docs/**'
      - 'patches/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build TEAR DSP WebAssembly Engine
        run: |
          mkdir -p _site/synths/tear
          emcc tools/tear_harness/main_wasm.cpp tools/tear_harness/TearDSP.cpp \
            -O3 -std=c++20 \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="TearModule" \
            -s EXPORTED_FUNCTIONS="['_tear_init','_tear_reset','_tear_note_on','_tear_note_off','_tear_set_param','_tear_get_param','_tear_render','_tear_is_playing','_malloc','_free']" \
            -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap','HEAPF32']" \
            -o _site/synths/tear/tear_dsp.js

      - name: Build JUNO DSP WebAssembly Engine
        run: |
          mkdir -p _site/synths/juno
          emcc tools/juno_harness/main_wasm.cpp tools/juno_harness/JunoDSP.cpp \
            -O3 -std=c++20 \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="JunoModule" \
            -s EXPORTED_FUNCTIONS="['_juno_init','_juno_reset','_juno_note_on','_juno_note_off','_juno_all_notes_off','_juno_set_param','_juno_get_param','_juno_render','_juno_active_voices','_juno_param_count','_juno_param_min','_juno_param_max','_juno_param_default','_malloc','_free']" \
            -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap','HEAPF32']" \
            -o _site/synths/juno/juno_dsp.js

      - name: Assemble Web Pages
        run: |
          # Copy synth pages
          cp tools/tear_harness/index.html _site/synths/tear/index.html
          cp tools/juno_harness/index.html _site/synths/juno/index.html
          # Root portal landing page
          cp docs/index.html _site/index.html
          # Copy preset bundles for direct download
          mkdir -p _site/patches
          cp patches/*.zip _site/patches/ || true
          # Ensure GitHub Pages does not run Jekyll
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
